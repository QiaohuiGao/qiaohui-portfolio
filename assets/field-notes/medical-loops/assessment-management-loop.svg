<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Clinical assessment and care management loops</title>
  <desc id="desc">A shared patient state connects an assessment loop and a care management loop. New observations from monitoring feed back into evidence gathering and both loops update the shared state.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#47766f"/></marker>
  </defs>
  <rect width="1200" height="720" fill="#eef2f2"/>
  <text x="90" y="70" font-family="Instrument Sans, Arial, sans-serif" font-size="25" font-weight="700" fill="#18262d">Clinical assessment loop</text>
  <text x="840" y="70" font-family="Instrument Sans, Arial, sans-serif" font-size="25" font-weight="700" fill="#18262d">Care management loop</text>
  <g font-family="Instrument Sans, Arial, sans-serif" text-anchor="middle">
    <circle cx="600" cy="350" r="118" fill="#304854" stroke="#8dc8b7" stroke-width="3"/>
    <text x="600" y="331" font-size="25" font-weight="700" fill="#fbf7ef">Shared patient state</text>
    <text x="600" y="366" font-size="17" fill="#dce8e5">assessment · uncertainty · goals</text>
    <text x="600" y="393" font-size="17" fill="#dce8e5">plan · actual actions</text>
    <g fill="#dfe9e7" stroke="#47766f" stroke-width="2" font-size="19">
      <rect x="75" y="154" width="260" height="84" rx="17"/><rect x="75" y="306" width="260" height="84" rx="17"/><rect x="75" y="458" width="260" height="84" rx="17"/>
      <rect x="865" y="154" width="260" height="84" rx="17"/><rect x="865" y="306" width="260" height="84" rx="17"/><rect x="865" y="458" width="260" height="84" rx="17"/>
    </g>
    <g fill="#18262d" font-size="19">
      <text x="205" y="188">Identify needed</text><text x="205" y="214">information</text>
      <text x="205" y="340">Gather and verify</text><text x="205" y="366">evidence</text>
      <text x="205" y="492">Interpret and revise</text><text x="205" y="518">the assessment</text>
      <text x="995" y="188">Choose a</text><text x="995" y="214">care plan</text>
      <text x="995" y="340">Carry out and</text><text x="995" y="366">confirm the action</text>
      <text x="995" y="492">Monitor the</text><text x="995" y="518">response</text>
    </g>
  </g>
  <g fill="none" stroke="#47766f" stroke-width="4" marker-end="url(#arrow)">
    <path d="M492 304C420 230 380 196 345 196"/><path d="M205 238V296"/><path d="M205 390V448"/><path d="M345 500C408 490 445 442 493 401"/>
    <path d="M708 304C780 230 820 196 855 196"/><path d="M995 238V296"/><path d="M995 390V448"/><path d="M855 500C792 490 755 442 707 401"/>
    <path d="M865 500C676 620 458 620 335 500" stroke-dasharray="10 9"/>
  </g>
  <text x="600" y="636" font-family="Instrument Sans, Arial, sans-serif" font-size="18" text-anchor="middle" fill="#66747a">new observations feed back into evidence gathering</text>
</svg>
